name: Deploy to STAG-APP1

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stag
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Quality gate — runs BEFORE anything is written to the deploy dir, so a
      # broken typecheck stops the deploy here and the old container keeps
      # serving. Lint runs too but is non-blocking while the pre-existing
      # no-explicit-any backlog (see APP-AUDIT-REPORT) is being cleared.
      - name: Quality gate (typecheck + lint)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo -v ads-npm-cache:/root/.npm node:22-alpine sh -c '
            npm ci --no-audit --no-fund
            npx tsc --noEmit
            npm run lint || echo "::warning::lint reported issues (non-blocking)"
          '

      - name: Sync code to deploy dir
        run: |
          # tar only adds/overwrites; remove files deleted from the repo so they
          # don't linger. middleware.ts was renamed to proxy.ts in Next 16 — a
          # stale middleware.ts on the server breaks the build.
          rm -rf /opt/asset-delivery-system/src/src
          rm -f /opt/asset-delivery-system/src/middleware.ts
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=.env --exclude=.env.* --exclude='*.tmp.js' --exclude='*.log' --exclude=project.tgz -cf - . | (cd /opt/asset-delivery-system && tar -xf -)

      - name: Build & restart app
        run: |
          cd /opt/asset-delivery-system
          docker compose up -d --build

      - name: Health check
        run: |
          port=$(grep -E '^APP_PORT=' /opt/asset-delivery-system/.env 2>/dev/null | cut -d= -f2 || echo 3000)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/" || echo 000)
            echo "Attempt ${i}: HTTP ${code}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 4
          done
          echo "App did not become healthy" && exit 1

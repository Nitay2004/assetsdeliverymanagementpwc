services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://assetdelivery:assetdelivery@10.199.206.99:5433/assetdelivery
        DIRECT_URL: postgresql://assetdelivery:assetdelivery@10.199.206.99:5433/assetdelivery
    container_name: asset-delivery
    restart: unless-stopped
    ports:
      - "8001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://assetdelivery:assetdelivery@10.199.206.99:5433/assetdelivery
      - DIRECT_URL=postgresql://assetdelivery:assetdelivery@10.199.206.99:5433/assetdelivery
      # Compose interpolates these from the .env next to this file. The compose
      # file sets `environment` explicitly, so without listing a variable here it
      # never reaches the container.
      - PAFEX_API_COMPANY_ID=${PAFEX_API_COMPANY_ID:-}
      - PAFEX_CUSTOMER_CODE=${PAFEX_CUSTOMER_CODE:-}
      - PAFEX_COURIER_NAMES=${PAFEX_COURIER_NAMES:-}
      - PAFEX_SYNC_API_KEY=${PAFEX_SYNC_API_KEY:-}
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:

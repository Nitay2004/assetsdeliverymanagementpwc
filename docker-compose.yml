services:
  # Applies pending migrations, then exits. `migrate deploy` is a no-op when the
  # database is already at the latest migration, so running it on every `up` is
  # safe. The app waits for it to exit 0, so a migration that fails leaves the
  # currently running container untouched instead of taking the deploy down.
  migrate:
    build:
      context: .
      target: migrator
    container_name: asset-delivery-migrate
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DIRECT_URL=${DIRECT_URL:-}

  app:
    build:
      context: .
    container_name: asset-delivery
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-}
      - DIRECT_URL=${DIRECT_URL:-}
      # Compose interpolates these from the .env next to this file. The compose
      # file sets `environment` explicitly, so without listing a variable here it
      # never reaches the container.
      - PAFEX_API_COMPANY_ID=${PAFEX_API_COMPANY_ID:-}
      - PAFEX_CUSTOMER_CODE=${PAFEX_CUSTOMER_CODE:-}
      - PAFEX_SYNC_API_KEY=${PAFEX_SYNC_API_KEY:-}
      - TWO_FACTOR_ENCRYPTION_KEY=${TWO_FACTOR_ENCRYPTION_KEY:-}
      - POD_API_KEY=${POD_API_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:

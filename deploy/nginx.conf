# Nginx site for the PWC asset-delivery app.
#
# Production currently runs on DRServer-1 behind :8080 because port 80 on that
# host is already taken by another service (docker-proxy), and the active
# firewalld zone only allows 8080/tcp in addition to 8400/8401/8403 + ssh.
#
# Two things here are load-bearing — do not "simplify" them:
#
# 1. `Host $http_host` (not `$host`). `$host` drops the port, so the browser sends
#    `Origin: http://host:8080` while Next sees `x-forwarded-host: host`. Next.js
#    validates those two against each other for every Server Action, and a
#    mismatch aborts the action with "Invalid Server Actions request" — which
#    shows up as a login that silently does nothing.
# 2. `client_max_body_size` must stay above the app's own 10 MB POD upload limit,
#    otherwise nginx rejects the request with 413 before it reaches the app.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/asset-delivery
#   sudo ln -sf /etc/nginx/sites-available/asset-delivery /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # if firewalld is active (default zone public):
#   sudo firewall-cmd --zone=public --add-port=8080/tcp
#   sudo firewall-cmd --zone=public --add-port=8080/tcp --permanent
server {
    listen 8080;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_cache_bypass $http_upgrade;
    }

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
